name: Build

# Elle çalıştır: GitHub → Actions → Build → "Run workflow"  (Windows .zip artifact'i çıkar)
# Sürüm yayınla:  git tag v1.0.6 && git push origin v1.0.6  (zip, Releases sayfasına eklenir)
# Run it by hand: GitHub → Actions → Build → "Run workflow" (produces a Windows .zip artifact)
# Publish a release: git tag v1.0.6 && git push origin v1.0.6 (the zip is attached to the Release)
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write   # needed to attach the zip to a Release

jobs:
  test:
    name: Tests (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  build-windows:
    name: Build (Windows exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install PySide6-Essentials requests pyinstaller
      - name: Build
        run: pyinstaller --noconfirm --noconsole --name CivitaiGrabber main.py
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/CivitaiGrabber -DestinationPath CivitaiGrabber-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CivitaiGrabber-windows
          path: CivitaiGrabber-windows.zip
      - name: Release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          $t = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $m = [regex]::Match($t, "(?ms)^## $([regex]::Escape($v)) .*?(?=^## |\z)")
          if (-not $m.Success) { $m = [regex]::Match($t, "(?ms)^## .*?(?=^## |\z)") }
          Set-Content release_notes.md $m.Value -Encoding utf8
      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: CivitaiGrabber-windows.zip
          body_path: release_notes.md
